      required: true
      limit: 100
    - name: key features
      required: true
      limit: 8
    - name: pricing
      required: true
    - name: logo
      required: true
    - name: screenshots
      required: true
  conditions:
    - human review
    - Maximum 4 screenshots selections/uploads
autofetch:
  supported: false

id: clawhub
name: ClawHub (OpenClaw skills and plugins registry)
website: https://clawhub.ai
submission_url: https://docs.openclaw.ai/clawhub
cost:
  classification: VERIFIED_FREE
  notes: "Open registry; publishing uses the clawhub CLI. No fee stated in the docs read. Publishing a skill releases it under MIT-0 on ClawHub."
audience:
  - agent-plugins
  - developer-tools
authentication:
  required: true
  signup_allowed: true
  methods:
    - github
submission:
  url_first: false
  fields: []
  conditions:
    - "Skills: clawhub skill publish <folder-with-SKILL.md>; plugins: clawhub package publish <folder|owner/repo|GitHub URL>"
    - Log in with clawhub login (GitHub); confirm with clawhub whoami
    - Publishing requires a GitHub account old enough to pass an upload gate; the minimum age is not stated in the docs
    - Published skills are released under MIT-0 (no attribution required)
    - "Releases are stored pending and security-scanned; held or blocked releases stay out of search, install and download but remain visible to the owner in /dashboard"
    - "Code plugins need openclaw.plugin.json plus package.json with openclaw.compat.pluginApi and openclaw.build.openclawVersion, and source repo and commit metadata"
autofetch:
  supported: false
  expected: []
media:
  logo: false
  screenshots:
    supported: false
kind: plugin_marketplace
human_only: null
link:
  rel: unknown
  method: none
  evidence: null
  samples: 0
  noindex: null
  claimed: null
  bot_check: none
  unmeasured: no_outbound_link
  checked_at: 2026-10-26
verification:
  status: verified
  checked_at: 2026-10-26
  by: claude-code
  sources:
    - https://docs.openclaw.ai/clawhub
    - https://docs.openclaw.ai/tools/clawhub
    - https://raw.githubusercontent.com/openclaw/clawhub/main/docs/publishing.md
    - https://raw.githubusercontent.com/openclaw/clawhub/main/docs/cli.md
    - https://github.com/openclaw/clawhub
    - https://clawhub.ai

  conditions:
    - No submit form; a skill appears only after installs are reported by the skills CLI telemetry
    - Skill must be a public GitHub repository with a SKILL.md
    - Ranking is by install count (All Time, Trending 24h, Hot)
    - Telemetry can be disabled by users, so counts may under-report
    - No removal process documented; the FAQ points to opening an issue in the skill's repo

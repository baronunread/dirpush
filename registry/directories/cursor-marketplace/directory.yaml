id: cursor-marketplace
name: Cursor Marketplace
website: https://cursor.com/marketplace
submission_url: https://cursor.com/marketplace/publish
cost:
  classification: VERIFIED_FREE
  notes: "Marketplace Publisher Terms state Anysphere offers the Marketplace to publishers free of charge; plugins must also be free for users. Manual review, can reject for any reason."
audience:
  - agent-plugins
  - mcp-servers
authentication:
  required: true
  signup_allowed: true
  methods: []
submission:
  url_first: false
  fields: []
  conditions:
    - Submit each plugin (MCP servers, skills, rules, hooks bundled as a plugin) through the application at cursor.com/marketplace/publish
    - Plugins must be open source with a permissive license (MIT, BSD, Apache 2.0); copyleft (GPL, AGPL, LGPL) not allowed
    - Manual review of identity, business legitimacy and code; each update is reviewed before publishing
    - Plugin must be free for users; terms of service and privacy policy must be visible
    - "Forum posts disagree on whether the form is still the live route; staff said in July 2026 that everything was centralized on cursor.directory, and in October 2026 that the form feeds a manually reviewed queue"
